bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Keymaps
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# Window Controls
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

# Session Controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session

# General
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty*:RGB"
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
setw -g pane-base-index 1
setw -g aggressive-resize on

# Look & Feel + Catppuccin theme (not as plugin as per their recommendation) 
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Clone the catppuccin repo if not present
if "test ! -d ~/.config/tmux/plugins/catppuccin/tmux" \
   "run 'git clone -b v2.3.0 https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux'"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status bar
set -g status-position top
set -gw automatic-rename on
set -g status-left ""
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Clone tpm repo if not present
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
